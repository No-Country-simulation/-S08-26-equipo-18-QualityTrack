name: CI Backend

# Compila el backend (con chequeo de tipos) en cada PR y en develop,
# para que un error de compilación no llegue a main sin que nadie lo vea.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: ["develop"]
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qualitytrack_security
          POSTGRES_USER: qualitytrack_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualitytrack_test -d qualitytrack_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECURITY_TEST_DB: "true"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSL: "false"
      POSTGRES_DB: qualitytrack_security
      POSTGRES_USER: qualitytrack_test
      POSTGRES_PASSWORD: ci_test_only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Security tests
        run: pnpm run test:security
