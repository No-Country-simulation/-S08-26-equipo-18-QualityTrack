name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"

jobs:
  # Corre las migraciones de MikroORM antes de desplegar.
  # Si fallan, el job "deploy" no se ejecuta.
  migrations:
    uses: ./.github/workflows/migrate-backend.yml
    secrets: inherit

  deploy:
    needs: migrations
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
