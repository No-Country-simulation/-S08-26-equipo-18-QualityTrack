services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:3000

    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules
      - document_files:/app/uploads

    environment:
      NODE_ENV: development
      # Detectar cambios en los volúmenes de Docker Desktop sobre Windows.
      CHOKIDAR_USEPOLLING: "true"
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL: "false"
      POSTGRES_DB: ${POSTGRES_DB:?Definir POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Generar JWT_ACCESS_SECRET en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Definir ADMIN_EMAIL para el seed local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definir ADMIN_PASSWORD para el seed local}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Administrador}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-QualityTrack}
      ADMIN_DNI: ${ADMIN_DNI:-}
      DOCUMENT_STORAGE_DIR: /app/uploads/documents
      DOCUMENT_MAX_FILE_BYTES: ${DOCUMENT_MAX_FILE_BYTES:-10485760}
      DOCUMENT_ALLOWED_EXTENSIONS: ${DOCUMENT_ALLOWED_EXTENSIONS:-pdf,png,jpg,jpeg,txt,csv}

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  document_files:
